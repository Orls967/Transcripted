[project]
name = "live-stt"
version = "0.1.0"
description = "Live speech-to-text lokal di Apple Silicon (mlx-whisper + Silero VAD ONNX)"
readme = "README.md"
authors = [
    { name = "Orls967", email = "2410817210017@mhs.ulm.ac.id" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.4.6",
    "onnxruntime>=1.31.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
live-stt = "live_stt.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# mlx-whisper mendeklarasikan torch, tetapi hanya skrip konversi modelnya yang
# memakainya; jalur transkripsi tidak. Dikecualikan agar instalasi tetap ringan.
exclude-dependencies = ["torch"]
